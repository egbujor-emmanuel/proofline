<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subscription Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Your Subscription</h1>

    <p class="plan-row">
      Current plan: <span id="plan-value" class="plan-badge">loading…</span>
    </p>

    <button id="upgrade-btn">Upgrade to Pro</button>
    <p id="upgrade-message" class="message"></p>

    <section id="pro-feature-section">
      <h2>Advanced Reports</h2>
      <div id="pro-feature-content">Checking access…</div>
    </section>

    <hr />
    <button id="reset-btn" class="dev-button">Reset to Free (dev/testing)</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
